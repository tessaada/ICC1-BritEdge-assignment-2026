name: Trigger auto deployment for test-poc

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/test-poc-AutoDeployTrigger-fc8c2d4e-26c7-472d-95d9-8281b78b6e79.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TESTPOC_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TESTPOC_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TESTPOC_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.TESTPOC_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.TESTPOC_REGISTRY_PASSWORD }}
          containerAppName: test-poc
          resourceGroup: britedge-poc
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


